# apache-protect.conf
#
# WHY THIS FILE EXISTS
# The Dockerfile copies the whole project into the web folder (/var/www/html). Without these rules
# anybody could download files such as https://<your-app>.onrender.com/Database/b5_project.sqlite
# (all users and password hashes!) or read the SQL and Java sources.
#
# HOW IT WORKS
# "Require all denied" makes Apache answer with "403 Forbidden". It only affects requests that
# come in through the web server. PHP itself still opens the database file normally.
#
# HOW TO CHECK AFTER A DEPLOY
# Open /Database/b5_project.sqlite in the browser. You must see "403 Forbidden", not a download.

# The whole database folder
<Directory /var/www/html/Database>
    Require all denied
</Directory>

# Java sources are not used on Render (there is no Java in the image)
<Directory /var/www/html/Java_Src>
    Require all denied
</Directory>

# File types that are never meant to be downloaded
<FilesMatch "(?i)\.(sqlite|sql|java|py|sh|md|conf)$">
    Require all denied
</FilesMatch>

# Docker files
<FilesMatch "^(Dockerfile|\.dockerignore)$">
    Require all denied
</FilesMatch>
